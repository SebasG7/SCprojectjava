# Configuración para producción con H2 en memoria (solo para pruebas/demo)
spring.application.name=scprojectjava2

# Base de datos - H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de JPA y Hibernate para H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# Habilitar consola H2 (solo para desarrollo)
spring.h2.console.enabled=false

# Configuración de usuarios de prueba (se crean automáticamente si la BD está vacía)
app.admin.username=admin
app.admin.password=admin123
app.admin.name=Administrador del Sistema

# Configuraciones de Thymeleaf
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Puerto del servidor
server.port=${PORT:8080}

# Configuración de logging para producción
logging.level.org.springframework=INFO
logging.level.com.scprojectjava2=INFO
logging.level.org.hibernate=INFO

# Configuración de seguridad
server.error.include-stacktrace=never
server.error.include-message=always

# Configuración de actuator para health checks (Render)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
management.endpoint.health.probes.enabled=true
