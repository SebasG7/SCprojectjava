<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a506b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5d89ba;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f4f8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with border -->
  <circle cx="16" cy="16" r="15" fill="url(#primaryGradient)" stroke="#2c3e50" stroke-width="1"/>
  
  <!-- Inner shadow effect -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  
  <!-- SC letters with better typography -->
  <g fill="url(#textGradient)" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="12" text-anchor="middle">
    <!-- S letter -->
    <text x="11" y="19" style="font-size:13px;">S</text>
    <!-- C letter -->
    <text x="21" y="19" style="font-size:13px;">C</text>
  </g>
  
  <!-- Subtle highlight on top -->
  <ellipse cx="16" cy="8" rx="8" ry="3" fill="rgba(255,255,255,0.15)"/>
  
  <!-- Small accent dot -->
  <circle cx="16" cy="25" r="1" fill="rgba(255,255,255,0.6)"/>
</svg>
