spring.application.name=scprojectjava2
spring.datasource.url=jdbc:mysql://localhost:3306/scprojectjava
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuraci\u00c3\u00b3n de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuraciones de Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Cambiar el puerto
server.port=8080

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.mvc.view.prefix=/templates/
spring.mvc.view.suffix=.html
spring.thymeleaf.cache=false

# Configuración para inicialización de datos (desactivado)
# spring.sql.init.mode=always
# spring.sql.init.data-locations=classpath:data.sql

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuraci\u00f3n personalizada para facturas
app.facturas.path=${java.io.tmpdir}/facturas

# Configuraci\u00f3n de correo (si usas Spring Mail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
