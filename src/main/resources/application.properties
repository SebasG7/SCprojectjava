spring.application.name=scprojectjava2

# Configuración por defecto - H2 en memoria para que funcione sin configuración externa
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de JPA y Hibernate para H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Configuración de usuarios de prueba (se crean automáticamente si la BD está vacía)
app.admin.username=admin
app.admin.password=admin123
app.admin.name=Administrador del Sistema

# Configuraciones de Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Puerto del servidor
server.port=${PORT:8080}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.mvc.view.prefix=/templates/
spring.mvc.view.suffix=.html

# Configuración de actuator para health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
management.endpoint.health.probes.enabled=true

# Desactivar configuración de inicialización de datos
# spring.sql.init.mode=always
# spring.sql.init.data-locations=classpath:data.sql

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuración personalizada para facturas
app.facturas.path=${java.io.tmpdir}/facturas

# Configuración de correo (si usas Spring Mail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=scproject30@gmail.com
spring.mail.password=gpuuflguahbaetum
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true