        /* Animation for card appearance */

    </style>

                        <div id="productosContainer">
                            <!-- Los productos se agregarán aquí dinámicamente desde la búsqueda -->

                    <div class="d-flex justify-content-end mt-2"> <!-- Reducido de mt-3 a mt-2 -->

        </div>
    </div>    <!-- Scripts -->
    <script>
        // ========== DEFINICIONES DE FUNCIONES GLOBALES (ANTES DE QUE SE USEN) ==========
        
        // Global variables
        window.contadorProductos = 0;
        window.productosData = {};
        window.productosDataConIva = {};

        // ========== FUNCIONES PRINCIPALES QUE SE USAN EN onclick ==========
        
        // Función para buscar productos con AJAX - DEFINIDA TEMPRANO
        window.buscarProductos = function(busquedaParam, categoriaParam) {
            console.log('buscarProductos ejecutada');
            // Mostrar indicador de carga
            const loadingIndicator = document.createElement('div');
            loadingIndicator.className = 'text-center p-3';
            loadingIndicator.innerHTML = '<div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando...</span></div><p class="mt-2">Buscando productos...</p>';
            
            const container = document.getElementById('productosListaContainer');
            container.innerHTML = '';
            container.appendChild(loadingIndicator);
            
            // Obtener valores de búsqueda
            const busqueda = busquedaParam !== undefined ? busquedaParam : document.getElementById('busqueda').value;
            const categoria = categoriaParam !== undefined ? categoriaParam : document.getElementById('categoria').value;
            
            // Actualizar campos de búsqueda si se proporcionan parámetros
            if (busquedaParam !== undefined) {
                document.getElementById('busqueda').value = busqueda;
            }
            if (categoriaParam !== undefined) {
                document.getElementById('categoria').value = categoria;
            }
            
            // Construir URL para la solicitud AJAX
            let url = '/test-ventas/buscar-ajax?';
            if (busqueda) {
                url += 'busqueda=' + encodeURIComponent(busqueda) + '&';
            }
            if (categoria) {
                url += 'categoria=' + encodeURIComponent(categoria);
            }
            
            // Realizar la solicitud AJAX
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Error en la búsqueda: ' + response.status);
                    }
                    return response.text();
                })
                .then(html => {
                    // Actualizar contenedor con resultados
                    container.innerHTML = html;
                })
                .catch(error => {
                    console.error('Error en búsqueda AJAX:', error);
                    container.innerHTML = `
                        <div class="alert alert-danger alert-custom alert-danger-custom">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            Error al buscar productos: ${error.message}
                        </div>
                    `;
                });
        };

        // Función para limpiar filtros - DEFINIDA TEMPRANO  
        window.limpiarFiltros = function() {
            console.log('limpiarFiltros ejecutada');
            
            // Limpiar campos de búsqueda
            document.getElementById('busqueda').value = '';
            document.getElementById('categoria').value = '';
            
            // Realizar búsqueda con filtros vacíos (mostrará todos los productos)
            window.buscarProductos('', '');
        };

        // Función para agregar producto desde la grilla - DEFINIDA TEMPRANO
        window.agregarProductoDesdeGrid = function(button) {
            console.log('agregarProductoDesdeGrid ejecutada');
            try {
                // Obtener datos del producto desde el botón
                const productoId = button.getAttribute('data-id');
                const nombre = button.getAttribute('data-nombre');
                const precioBase = parseFloat(button.getAttribute('data-precio'));
                const precioConIva = parseFloat(button.getAttribute('data-precio-con-iva'));
                const iva = parseFloat(button.getAttribute('data-iva')) || 0;
                const codigo = button.getAttribute('data-codigo');
                const isVencido = button.getAttribute('data-vencido') === 'true';
                
                if (!productoId || !nombre || isNaN(precioBase) || isNaN(precioConIva)) {
                    console.error('Datos de producto incompletos:', productoId, nombre, precioBase, precioConIva);
                    return;
                }
                
                // Validar que el producto no esté vencido
                if (isVencido) {
                    Swal.fire({
                        title: 'Producto vencido',
                        text: `No se puede agregar ${nombre} al carrito porque está vencido`,
                        icon: 'error',
                        confirmButtonText: 'Entendido',
                        confirmButtonColor: '#dc3545'
                    });
                    return;
                }
                
                console.log(`Agregando producto desde grid: ${nombre}, precio base: ${precioBase}, precio con IVA: ${precioConIva}`);
                
                // Buscar el contenedor de productos
                const container = document.getElementById("productosContainer");
                
                if (!container) {
                    console.error('No se encontró el contenedor de productos');
                    return;
                }
                
                // Verificar si el producto ya existe en el carrito
                const productosExistentes = container.querySelectorAll(".producto-item");
                let productoExistente = null;
                
                for (const item of productosExistentes) {
                    const select = item.querySelector("select");
                    if (select && select.value === productoId) {
                        productoExistente = item;
                        break;
                    }
                }
                
                if (productoExistente) {
                    // Producto ya existe, incrementar cantidad
                    const cantidadInput = productoExistente.querySelector("input[name*='cantidad']");
                    if (cantidadInput) {
                        const cantidadActual = parseInt(cantidadInput.value) || 0;
                        cantidadInput.value = cantidadActual + 1;
                        window.calcularSubtotal(productoExistente);
                    }
                } else {
                    // Producto nuevo, crear elemento
                    // Limpiar mensaje informativo si existe
                    const alertInfo = container.querySelector('.alert-info');
                    if (alertInfo) {
                        alertInfo.remove();
                    }
                    
                    const nuevoProducto = window.crearProductoItem(productoId, nombre, precioBase, precioConIva, iva, 1, isVencido);
                    container.appendChild(nuevoProducto);
                    
                    // Actualizar datos de productos
                    window.productosData[productoId] = precioBase;
                    window.productosDataConIva[productoId] = precioConIva;
                }
                
                // Recalcular total
                window.calcularTotal();
                
                // Mostrar notificación
                Swal.fire({
                    title: 'Producto agregado',
                    text: `${nombre} se ha agregado al carrito`,
                    icon: 'success',
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 3000
                });
                
                // Guardar carrito
                window.guardarCarrito();
                
                // Hacer scroll al carrito para que el usuario vea el cambio
                container.scrollIntoView({ behavior: 'smooth' });
                
            } catch (error) {
                console.error('Error al agregar producto desde grid:', error);
                Swal.fire({
                    title: 'Error',
                    text: 'No se pudo agregar el producto al carrito',
                    icon: 'error',
                    confirmButtonColor: '#3a506b'
                });
            }
        };

        // Función para limpiar carrito completo - DEFINIDA TEMPRANO
        window.limpiarCarritoCompleto = function() {
            console.log('limpiarCarritoCompleto ejecutada');
            // Confirmar con el usuario
            Swal.fire({
                title: '¿Estás seguro?',
                text: "Se perderán todos los productos y correos agregados al carrito.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#3a506b',
                cancelButtonColor: '#dc3545',
                confirmButtonText: 'Sí, limpiar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    // Limpiar localStorage
                    window.limpiarCarrito();
                    
                    // Resetear formulario
                    window.contadorProductos = 0;
                    
                    // Limpiar nombre del cliente
                    const nombreClienteInput = document.getElementById('nombreCliente');
                    if (nombreClienteInput) {
                        nombreClienteInput.value = '';
                    }
                    
                    // Limpiar correos (dejar solo el primero)
                    const container = document.getElementById('correos-container');
                    container.innerHTML = `
                        <div class="input-group input-group-custom mb-3">
                            <input type="email" name="correos" class="form-control form-control-custom" 
                                   placeholder="correo@cliente.com">
                            <button type="button" class="btn btn-success-custom btn-custom" onclick="window.agregarCorreo()">
                                <i class="bi bi-plus-lg"></i> Agregar
                            </button>
                        </div>
                    `;
                    
                    // Limpiar todos los productos y restaurar mensaje informativo
                    const productosContainer = document.getElementById("productosContainer");
                    if (productosContainer) {
                        productosContainer.innerHTML = `
                            <div class="alert alert-info alert-custom alert-info-custom">
                                <i class="bi bi-info-circle me-2"></i>
                                Use la búsqueda de productos arriba para agregar productos al carrito.
                            </div>
                        `;
                    }
                    
                    // Recalcular total (debería ser 0)
                    window.calcularTotal();
                    
                    Swal.fire({
                        title: 'Carrito limpiado',
                        text: 'Se ha limpiado el carrito exitosamente.',
                        icon: 'success',
                        confirmButtonColor: '#3a506b'
                    });
                }
            });
        };

        // ========== RESTO DE FUNCIONES AUXILIARES ==========
        
        // Función para inicializar datos de productos
        window.inicializarProductos = function() {
            console.log('Inicializando datos de productos...');
            // The productosData will be populated when products are added from the search grid
            // or when loading saved cart data
        };

        // Function to create a new product item dynamically
        window.crearProductoItem = function(productoId, nombre, precioBase, precioConIva, iva, cantidad = 1, isVencido = false) {
            window.contadorProductos++;
            
            const productItem = document.createElement('div');
            productItem.className = 'producto-item mb-3 p-3 border rounded bg-light';
            
            productItem.innerHTML = `
                <div class="row align-items-center">
                    <div class="col-md-3">
                        <label class="form-label form-label-custom">Producto</label>
                        <select name="productos[${window.contadorProductos}].productoId" class="form-select form-control-custom" 
                                onchange="window.actualizarPrecio(this); window.calcularSubtotal(this.closest('.producto-item')); window.guardarCarrito();">
                            <option value="">Seleccione un producto</option>
                            <option value="${productoId}" data-precio="${precioBase}" data-precio-con-iva="${precioConIva}" data-iva="${iva}" data-vencido="${isVencido}" selected>${nombre}</option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <label class="form-label form-label-custom">Cantidad</label>
                        <input type="number" name="productos[${window.contadorProductos}].cantidad" 
                               class="form-control form-control-custom" min="1" value="${cantidad}"
                               onchange="window.calcularSubtotal(this.closest('.producto-item')); window.guardarCarrito();">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label form-label-custom">Precio Base</label>
                        <input type="number" class="form-control form-control-custom" step="0.01" readonly value="${precioBase.toFixed(2)}">
                    </div>
                    <div class="col-md-1">
                        <label class="form-label form-label-custom">IVA %</label>
                        <input type="number" class="form-control form-control-custom" step="0.01" readonly value="${iva.toFixed(1)}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label form-label-custom">Precio Unitario (con IVA)</label>
                        <input type="number" name="productos[${window.contadorProductos}].precioUnitario" 
                               class="form-control form-control-custom" step="0.01" readonly value="${precioConIva.toFixed(2)}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label form-label-custom">Subtotal</label>
                        <input type="number" class="form-control form-control-custom subtotal" readonly value="${(precioConIva * cantidad).toFixed(2)}">
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button type="button" class="btn btn-danger-custom btn-custom" 
                                onclick="window.eliminarProducto(this.closest('.producto-item'))">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
            `;
            
            return productItem;
        }
        
        // Funciones para manejo del carrito en sessionStorage - Global
        window.guardarCarrito = function() {
            try {
                const productos = [];
                const correos = [];
                
                // Verificar si hay elementos en el DOM antes de continuar
                const productosItems = document.querySelectorAll('.producto-item');
                const correosInputs = document.querySelectorAll('input[name="correos"]');
                const nombreClienteInput = document.getElementById('nombreCliente');
                
                if (productosItems.length === 0) {
                    console.warn('No hay elementos de producto para guardar');
                }
                
                // Guardar productos
                productosItems.forEach((item, index) => {
                    const select = item.querySelector('select');
                    const cantidadInput = item.querySelector("input[name*='cantidad']");
                    const precioUnitarioInput = item.querySelector("input[name*='precioUnitario']");
                    const precioBaseInput = item.querySelector("input[readonly]");
                    const ivaInput = item.querySelector("input[readonly]:nth-of-type(2)");
                    
                    if (!select || !cantidadInput || !precioUnitarioInput) {
                        console.warn(`Producto en posición ${index} incompleto, falta algún campo`);
                        return;
                    }
                    
                    const productoId = select.value;
                    const cantidad = cantidadInput.value;
                    const precioConIva = precioUnitarioInput.value;
                    
                    // Obtener datos adicionales del option seleccionado
                    const selectedOption = select.querySelector('option:checked');
                    const precioBase = selectedOption ? selectedOption.getAttribute('data-precio') : '';
                    const iva = selectedOption ? selectedOption.getAttribute('data-iva') : '';
                    const nombre = selectedOption ? selectedOption.textContent : '';
                    
                    // Solo guardar productos con datos válidos
                    if (productoId && cantidad && precioConIva) {
                        productos.push({
                            productoId: productoId,
                            cantidad: cantidad,
                            precioBase: precioBase || precioConIva,
                            precioConIva: precioConIva,
                            iva: iva || '0',
                            nombre: nombre,
                            precio: precioConIva // Mantener compatibilidad con versión anterior
                        });
                    }
                });
                  // Guardar correos (solo los que no estén vacíos)
                correosInputs.forEach(input => {
                    if (input.value.trim()) {
                        correos.push(input.value.trim());
                    }
                });
                
                // Obtener nombre del cliente
                const nombreCliente = nombreClienteInput ? nombreClienteInput.value.trim() : '';
                
                const carritoData = {
                    productos: productos,
                    correos: correos,
                    nombreCliente: nombreCliente,
                    contador: contadorProductos,
                    timestamp: Date.now()
                };
                
                // Guardar en localStorage y hacer una verificación adicional
                localStorage.setItem('carritoVentas', JSON.stringify(carritoData));
                
                // Verificar que se guardó correctamente
                const verificacion = localStorage.getItem('carritoVentas');
                const guardadoExitoso = !!verificacion;
                
                console.log(
                    guardadoExitoso 
                        ? `Carrito guardado con éxito: ${productos.length} productos y ${correos.length} correos` 
                        : 'Error: No se pudo guardar el carrito'
                );
                
                return carritoData;
            } catch (error) {
                console.error('Error al guardar carrito:', error);
                
                // Intentar recuperar un carrito previo
                try {
                    const carritoAnterior = localStorage.getItem('carritoVentas');
                    if (carritoAnterior) {
                        console.log('Se mantiene el carrito anterior debido al error');
                        return JSON.parse(carritoAnterior);
                    }
                } catch (e) {
                    console.error('No se pudo recuperar el carrito anterior:', e);
                }
                  return null;
            }
        }; // End of guardarCarrito function

        // Global function for loading cart
        window.cargarCarrito = function() {
            console.log('Intentando cargar carrito...');
            try {
                const carritoGuardado = localStorage.getItem('carritoVentas');
                
                if (!carritoGuardado) {
                    console.log('No hay carrito guardado');
                    return false;
                }
                
                const carrito = JSON.parse(carritoGuardado);
                console.log('Carrito encontrado con ' + (carrito.productos ? carrito.productos.length : 0) + ' productos');
                
                if (!carrito.productos || carrito.productos.length === 0) {
                    console.log('Carrito vacío, no hay nada que cargar');
                    return false;
                }
                
                contadorProductos = carrito.contador || 0;
                  // Verificar que tenemos elementos en el DOM
                const container = document.getElementById('correos-container');
                const productosContainer = document.getElementById("productosContainer");
                const nombreClienteInput = document.getElementById('nombreCliente');
                
                if (!container || !productosContainer) {
                    console.error('No se encontraron los contenedores necesarios, reintentando en 500ms');
                    return false;
                }
                
                // Restaurar nombre del cliente
                if (carrito.nombreCliente && nombreClienteInput) {
                    nombreClienteInput.value = carrito.nombreCliente;
                }
                
                // Restaurar correos
                if (carrito.correos && carrito.correos.length > 0) {
                    container.innerHTML = ''; // Limpiar correos existentes
                    
                    carrito.correos.forEach((correo, index) => {
                        const nuevoCampo = document.createElement('div');
                        nuevoCampo.classList.add('input-group', 'input-group-custom', 'mb-3');
                        
                        if (index === 0) {
                            nuevoCampo.innerHTML = `
                                <input type="email" name="correos" class="form-control form-control-custom" 
                                       placeholder="correo@cliente.com" value="${correo}">
                                <button type="button" class="btn btn-primary-custom btn-custom" onclick="window.agregarCorreo()">
                                    <i class="bi bi-plus-lg"></i> Agregar
                                </button>
                            `;
                        } else {
                            nuevoCampo.innerHTML = `
                                <input type="email" name="correos" class="form-control form-control-custom" 
                                       placeholder="correo@cliente.com" value="${correo}">
                                <button type="button" class="btn btn-danger-custom btn-custom" onclick="this.parentElement.remove(); window.guardarCarrito();">>
                                    <i class="bi bi-dash-lg"></i> Quitar
                                </button>
                            `;
                        }
                        container.appendChild(nuevoCampo);
                    });
                }
                  // Restaurar productos dinámicamente
                if (carrito.productos && carrito.productos.length > 0) {
                    // Limpiar mensaje informativo si existe
                    const alertInfo = productosContainer.querySelector('.alert-info');
                    if (alertInfo) {
                        alertInfo.remove();
                    }
                    
                    // Limpiar productos existentes
                    const productosExistentes = productosContainer.querySelectorAll(".producto-item");
                    productosExistentes.forEach(item => item.remove());
                    
                    // Crear productos desde el carrito guardado
                    carrito.productos.forEach((producto, index) => {
                        const productoItem = document.createElement('div');
                        productoItem.className = 'producto-item mb-3 p-3 border rounded bg-light';
                        
                        const precioBase = parseFloat(producto.precioBase) || parseFloat(producto.precio) || 0;
                        const precioConIva = parseFloat(producto.precioConIva) || precioBase;
                        const iva = parseFloat(producto.iva) || 0;
                        const cantidad = parseInt(producto.cantidad) || 1;
                        
                        productoItem.innerHTML = `
                            <div class="row align-items-center">
                                <div class="col-md-3">
                                    <label class="form-label form-label-custom">Producto</label>
                                    <select name="productos[${index}].productoId" class="form-select form-control-custom" 
                                            onchange="window.actualizarPrecio(this); window.calcularSubtotal(this.closest('.producto-item')); window.guardarCarrito();">
                                        <option value="">Seleccione un producto</option>
                                        <option value="${producto.productoId}" data-precio="${precioBase}" data-precio-con-iva="${precioConIva}" data-iva="${iva}" selected>
                                            ${producto.nombre || ('Producto ID: ' + producto.productoId)}
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-1">
                                    <label class="form-label form-label-custom">Cantidad</label>
                                    <input type="number" name="productos[${index}].cantidad" 
                                           class="form-control form-control-custom" min="1" value="${cantidad}"
                                           onchange="window.calcularSubtotal(this.closest('.producto-item')); window.guardarCarrito();">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label form-label-custom">Precio Base</label>
                                    <input type="number" class="form-control form-control-custom" step="0.01" readonly value="${precioBase.toFixed(2)}">
                                </div>
                                <div class="col-md-1">
                                    <label class="form-label form-label-custom">IVA %</label>
                                    <input type="number" class="form-control form-control-custom" step="0.01" readonly value="${iva.toFixed(1)}">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label form-label-custom">Precio Unitario (con IVA)</label>
                                    <input type="number" name="productos[${index}].precioUnitario" 
                                           class="form-control form-control-custom" step="0.01" readonly value="${precioConIva.toFixed(2)}">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label form-label-custom">Subtotal</label>
                                    <input type="number" class="form-control form-control-custom subtotal" readonly 
                                           value="${(precioConIva * cantidad).toFixed(2)}">
                                </div>
                                <div class="col-md-1 d-flex align-items-end">
                                    <button type="button" class="btn btn-danger-custom btn-custom" 
                                            onclick="window.eliminarProducto(this.closest('.producto-item'))">>
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                        
                        productosContainer.appendChild(productoItem);
                        
                        // Actualizar datos de productos
                        productosData[producto.productoId] = precioBase;
                        productosDataConIva[producto.productoId] = precioConIva;
                        
                        // Actualizar datos de productos
                        productosData[producto.productoId] = parseFloat(producto.precio);
                        productosDataConIva[producto.productoId] = parseFloat(producto.precio);
                    });
                    
                    calcularTotal();
                    console.log('Carrito cargado exitosamente');
                    return true;
                }
                return false;
            } catch (error) {
                console.error('Error al cargar carrito:', error);
                // No eliminar el carrito aquí para evitar pérdida de datos
                // Sólo en casos extremos de error de parseo
                if (error instanceof SyntaxError) {
                    localStorage.removeItem('carritoVentas');
                }
                return false;
            }
        }        // Global function for clearing cart
        window.limpiarCarrito = function() {
            try {
                // Limpiar localStorage
                localStorage.removeItem('carritoVentas');
                
                // Resetear contador
                window.contadorProductos = 0;
                
                // Limpiar nombre del cliente
                const nombreClienteInput = document.getElementById('nombreCliente');
                if (nombreClienteInput) {
                    nombreClienteInput.value = '';
                }
                
                // Limpiar correos (dejar solo el primero vacío)
                const container = document.getElementById('correos-container');
                if (container) {
                    container.innerHTML = `
                        <div class="input-group input-group-custom mb-2">
                            <input type="email" name="correos" class="form-control form-control-custom" 
                                   placeholder="correo@cliente.com">
                            <button type="button" class="btn btn-success-custom btn-custom" onclick="window.agregarCorreo()">
                                <i class="bi bi-plus-lg"></i> Agregar
                            </button>
                        </div>
                    `;
                }
                
                // Limpiar todos los productos y restaurar mensaje informativo
                const productosContainer = document.getElementById("productosContainer");
                if (productosContainer) {
                    productosContainer.innerHTML = `
                        <div class="alert alert-info alert-custom alert-info-custom">
                            <i class="bi bi-info-circle me-2"></i>
                            Use la búsqueda de productos arriba para agregar productos al carrito.
                        </div>
                    `;
                }
                
                // Recalcular total (debería ser 0)
                window.calcularTotal();
                
                console.log('Carrito limpiado exitosamente');
            } catch (error) {
                console.error('Error al limpiar carrito:', error);
            }
        }

        // Global function for clearing cart completely
        window.limpiarCarritoCompleto = function() {
            // Confirmar con el usuario
            Swal.fire({
                title: '¿Estás seguro?',
                text: "Se perderán todos los productos y correos agregados al carrito.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#3a506b',
                cancelButtonColor: '#dc3545',
                confirmButtonText: 'Sí, limpiar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {                if (result.isConfirmed) {
                    // Limpiar localStorage
                    window.limpiarCarrito();
                    
                    // Resetear formulario
                    contadorProductos = 0;
                    
                    // Limpiar nombre del cliente
                    const nombreClienteInput = document.getElementById('nombreCliente');
                    if (nombreClienteInput) {
                        nombreClienteInput.value = '';
                    }
                    
                    // Limpiar correos (dejar solo el primero)
                    const container = document.getElementById('correos-container');
                    container.innerHTML = `
                        <div class="input-group input-group-custom mb-3">
                            <input type="email" name="correos" class="form-control form-control-custom" 
                                   placeholder="correo@cliente.com">
                            <button type="button" class="btn btn-primary-custom btn-custom" onclick="window.agregarCorreo()">
                                <i class="bi bi-plus-lg"></i> Agregar
                            </button>
                        </div>
                    `;
                    
                    // Limpiar todos los productos y restaurar mensaje informativo
                    const productosContainer = document.getElementById("productosContainer");
                    if (productosContainer) {
                        productosContainer.innerHTML = `
                            <div class="alert alert-info alert-custom alert-info-custom">
                                <i class="bi bi-info-circle me-2"></i>
                                Use la búsqueda de productos arriba para agregar productos al carrito.
                            </div>
                        `;
                    }
                      // Recalcular total (debería ser 0)
                    window.calcularTotal();
                    
                    Swal.fire({
                        title: 'Carrito limpiado',
                        text: 'Se ha limpiado el carrito exitosamente.',
                        icon: 'success',
                        confirmButtonColor: '#3a506b'
                    });
                }
            });
        }
          // Función para agregar correos
        // Global function for adding email
        window.agregarCorreo = function() {
            console.log('agregarCorreo ejecutada');
            try {
                const container = document.getElementById('correos-container');
                if (!container) {
                    console.error('Container de correos no encontrado');
                    return;
                }
                
                const nuevoCampo = document.createElement('div');
                nuevoCampo.classList.add('input-group', 'input-group-custom', 'mb-3');
                nuevoCampo.innerHTML = `
                    <input type="email" name="correos" class="form-control form-control-custom" 
                           placeholder="correo@cliente.com">
                    <button type="button" class="btn btn-danger-custom btn-custom" onclick="this.parentElement.remove(); window.guardarCarrito();">
                        <i class="bi bi-dash-lg"></i> Quitar
                    </button>
                `;
                container.appendChild(nuevoCampo);
                window.guardarCarrito();
            } catch (error) {
                console.error('Error al agregar correo:', error);
            }
        };

        // Actualizar precio al seleccionar producto
        window.actualizarPrecio = function(select) {
            try {
                // Verificar si el producto seleccionado está vencido
                const selectedOption = select.querySelector('option:checked');
                if (selectedOption) {
                    const isVencido = selectedOption.getAttribute('data-vencido') === 'true';
                    if (isVencido) {
                        Swal.fire({
                            title: 'Producto vencido',
                            text: 'No se puede seleccionar este producto porque está vencido',
                            icon: 'error',
                            confirmButtonColor: '#dc3545'
                        });
                        select.value = ''; // Limpiar selección
                        return;
                    }
                }
                
                const precio = window.productosData[select.value] || 0;
                const row = select.closest(".producto-item");
                const precioInput = row.querySelector("input[name*='precioUnitario']");
                
                               
                if (precioInput) {
                    precioInput.value = precio.toFixed(2);
                    window.calcularSubtotal(select);
                    window.guardarCarrito();
                }
            } catch (error) {
                console.error('Error al actualizar precio:', error);
            }
        };

        // Calcular subtotal del producto
        window.calcularSubtotal = function(element) {
            try {
                const row = element.classList && element.classList.contains('producto-item') 
                    ? element 
                    : element.closest(".producto-item");
                
                if (!row) {
                    console.error('No se pudo encontrar el contenedor del producto');
                    return;
                }
                
                const select = row.querySelector("select");
                const cantidadInput = row.querySelector("input[name*='cantidad']");
                const precioUnitarioInput = row.querySelector("input[name*='precioUnitario']");
                const subtotalInput = row.querySelector(".subtotal");
                
                if (select && cantidadInput && precioUnitarioInput && subtotalInput) {
                    const cantidad = parseFloat(cantidadInput.value) || 0;
                    const precioUnitarioConIva = parseFloat(precioUnitarioInput.value) || 0;
                    
                    // Calcular subtotal (cantidad × precio unitario con IVA)
                    const subtotal = cantidad * precioUnitarioConIva;
                    
                    // Actualizar el campo subtotal
                    subtotalInput.value = subtotal.toFixed(2);
                    
                    window.calcularTotal();
                    window.guardarCarrito();
                } else {
                    console.error('No se encontraron todos los elementos necesarios para calcular subtotal');
                }
            } catch (error) {
                console.error('Error al calcular subtotal:', error);
            }
        };

        // Calcular total de la venta
        window.calcularTotal = function() {
            try {
                let total = 0;
                let productosValidos = 0;
                const subtotales = document.querySelectorAll(".subtotal");
                
                // Contar productos válidos y calcular total
                document.querySelectorAll('.producto-item').forEach(item => {
                    const select = item.querySelector('select');
                    const cantidad = item.querySelector("input[name*='cantidad']");
                    const precio = item.querySelector("input[name*='precioUnitario']");
                    
                    if (select.value && cantidad.value && parseFloat(cantidad.value) > 0 && precio.value && parseFloat(precio.value) > 0) {
                        productosValidos++;
                    }
                });
                
                subtotales.forEach(subtotalElement => {
                    const valor = parseFloat(subtotalElement.value) || 0;
                    total += valor;
                });
                
                // Actualizar total
                const totalElement = document.getElementById("totalVenta");
                if (totalElement) {
                    totalElement.textContent = total.toFixed(2);
                }
                
                // Actualizar contador de productos
                const contadorElement = document.getElementById("contadorProductos");
                if (contadorElement) {
                    contadorElement.textContent = productosValidos;
                }
            } catch (error) {
                console.error('Error al calcular total:', error);
            }
        };

        // Eliminar producto del carrito
        window.eliminarProducto = function(element) {
            console.log('eliminarProducto ejecutada');
            const item = element.closest(".producto-item");
            if (!item) {
                console.error('No se pudo encontrar el producto a eliminar');
                return;
            }
            
            const items = document.querySelectorAll(".producto-item");
            
            // Solo permitir eliminar si hay más de un producto o si es el único y está vacío
            if (items.length > 1) {
                // Si hay múltiples productos, simplemente eliminar este
                item.remove();
                window.calcularTotal();
                window.guardarCarrito();
                
                Swal.fire({
                    title: 'Producto eliminado',
                    text: 'El producto ha sido eliminado del carrito',
                    icon: 'success',
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 2000
                });
            } else {
                // Si es el único producto, preguntar si quiere limpiar todo el carrito
                Swal.fire({
                    title: '¿Limpiar carrito?',
                    text: 'Este es el único producto en el carrito. ¿Desea limpiar todo el carrito?',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#3a506b',
                    cancelButtonColor: '#6c757d',
                    confirmButtonText: 'Sí, limpiar carrito',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        window.limpiarCarritoCompleto();
                    }
                });
            }        };

        // ========== VALIDACIÓN DEL FORMULARIO ==========
        
        // Validar formulario antes de enviar
        document.addEventListener('DOMContentLoaded', function() {
            console.log('=== VENTAS.HTML - Página cargada ===');
            console.log('Funciones disponibles:');
            console.log('- buscarProductos:', typeof window.buscarProductos);
            console.log('- limpiarFiltros:', typeof window.limpiarFiltros);
            console.log('- agregarProductoDesdeGrid:', typeof window.agregarProductoDesdeGrid);
            console.log('- limpiarCarritoCompleto:', typeof window.limpiarCarritoCompleto);
            console.log('- guardarCarrito:', typeof window.guardarCarrito);
            console.log('- agregarCorreo:', typeof window.agregarCorreo);
            
            // Validar formulario
            const form = document.getElementById('ventaForm');
            if (form) {
                form.addEventListener('submit', function(e) {
                    // Validar nombre del cliente (obligatorio)
                    const nombreClienteInput = document.getElementById('nombreCliente');
                    if (!nombreClienteInput || !nombreClienteInput.value.trim()) {
                        e.preventDefault();
                        Swal.fire({
                            icon: 'error',
                            title: 'Error',
                            text: 'El nombre del cliente es obligatorio.',
                            confirmButtonColor: '#3a506b'
                        });
                        return;
                    }
                    
                    // Validar productos en el carrito
                    const productos = document.querySelectorAll('.producto-item');
                    let tieneProductosValidos = false;
                    let tieneProductosVencidos = false;
                    let productosVencidos = [];
                    
                    productos.forEach(producto => {
                        const select = producto.querySelector('select');
                        const cantidad = producto.querySelector("input[name*='cantidad']");
                        
                        if (select && select.value && cantidad && cantidad.value && parseFloat(cantidad.value) > 0) {
                            tieneProductosValidos = true;
                            
                            // Verificar si el producto está vencido
                            const selectedOption = select.querySelector('option:checked');
                            if (selectedOption) {
                                const isVencido = selectedOption.getAttribute('data-vencido') === 'true';
                                if (isVencido) {
                                    tieneProductosVencidos = true;
                                    productosVencidos.push(selectedOption.text);
                                }
                            }
                        }
                    });
                    
                    if (tieneProductosVencidos) {
                        e.preventDefault();
                        Swal.fire({
                            icon: 'error',
                            title: 'Productos vencidos detectados',
                            text: 'No se puede procesar la venta. Los siguientes productos están vencidos: ' + productosVencidos.join(', '),
                            confirmButtonColor: '#dc3545'
                        });
                        return;
                    }
                    
                    if (!tieneProductosValidos) {
                        e.preventDefault();
                        Swal.fire({
                            icon: 'error',
                            title: 'Error',
                            text: 'Debe agregar al menos un producto válido al carrito.',
                            confirmButtonColor: '#3a506b'
                        });
                        return;
                    }
                    
                    // Si todo está bien, limpiar carrito después del envío
                    localStorage.removeItem('carritoVentas');
                });
            }
            
            // Event listeners para búsqueda
            const busquedaInput = document.getElementById('busqueda');
            if (busquedaInput) {
                busquedaInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        window.buscarProductos();
                    }
                });
            }
            
            // Verificar si hay parámetro de éxito
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('success') === 'true') {
                localStorage.removeItem('carritoVentas');
                Swal.fire({
                    title: '¡Venta exitosa!',
                    text: 'La venta ha sido registrada exitosamente.',
                    icon: 'success',
                    confirmButtonColor: '#3a506b'
                });
            }
            
            console.log('=== INICIALIZACIÓN COMPLETADA ===');
        });

        // ========== FUNCIONES DE MANEJO DE CARRITO ==========
    </script>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

<!-- Script de seguridad para prevenir navegación hacia atrás después del logout -->
<script th:src="@{/js/security.js}"></script>

</body>
