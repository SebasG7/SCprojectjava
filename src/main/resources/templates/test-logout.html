<!DOCTYPE html>
<html>
<head>
    <title>Test Logout</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="shortcut icon" href="/icons/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#3a506b">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
</head>
<body>
    <div class="container mt-5">
        <h1>Test de Botón de Logout</h1>
        
        <button type="button" 
                id="testLogoutBtn" 
                class="btn btn-danger" 
                onclick="testLogout()">
            <i class="bi bi-box-arrow-right me-1"></i>
            Test Cerrar Sesión
        </button>
        
        <div id="console" class="mt-3 p-3 border" style="background: #f8f9fa; height: 300px; overflow-y: auto;">
            <h5>Console Output:</h5>
        </div>
    </div>
    
    <script>
        // Función de test para verificar funcionalidad
        function testLogout() {
            logToConsole('Test logout ejecutado');
            
            if (confirm('¿Ejecutar test de logout?')) {
                logToConsole('Usuario confirmó test');
                logToConsole('Limpiar storage...');
                localStorage.clear();
                sessionStorage.clear();
                logToConsole('Storage limpiado');
                
                logToConsole('Configurar prevención de navegación hacia atrás...');
                history.pushState(null, null, window.location.href);
                window.onpopstate = function () {
                    history.pushState(null, null, window.location.href);
                };
                
                logToConsole('Redirigiendo a /logout...');
                setTimeout(() => {
                    window.location.href = '/logout';
                }, 1000);
            } else {
                logToConsole('Usuario canceló test');
            }
        }
        
        function logToConsole(message) {
            const consoleDiv = document.getElementById('console');
            const time = new Date().toLocaleTimeString();
            consoleDiv.innerHTML += `<div>[${time}] ${message}</div>`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            console.log(`[${time}] ${message}`);
        }
        
        // Registrar eventos del DOM
        document.addEventListener('DOMContentLoaded', function() {
            logToConsole('DOM cargado');
            
            const testBtn = document.getElementById('testLogoutBtn');
            if (testBtn) {
                logToConsole('Botón de test encontrado');
            } else {
                logToConsole('ERROR: Botón de test NO encontrado');
            }
        });
    </script>
</body>
</html>
