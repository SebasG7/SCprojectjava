<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <footer th:fragment="footer" class="footer mt-auto py-4 modern-footer">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <div class="footer-brand">
                        <i class="bi bi-box-seam me-2"></i>
                        <span class="brand-text">SCProject</span>
                        <small class="brand-subtitle">Sistema de Puntos de Venta</small>
                    </div>
                </div>
                <div class="col-md-6 text-md-end text-center mt-3 mt-md-0">
                    <div class="footer-info">
                        <span class="version-badge">v2.1</span>
                        <small class="copyright-text">© 2025 Todos los derechos reservados</small>
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-12">
                    <div class="footer-divider"></div>

            </div>
        </div>
        
        <!-- Floating background elements -->
        <div class="footer-bg-elements">
            <div class="floating-shape shape-1"></div>
            <div class="floating-shape shape-2"></div>
            <div class="floating-shape shape-3"></div>
        </div>
    </footer>
    
    <style>
        .modern-footer {
            background: linear-gradient(135deg, #2c3e50 0%, #3a506b 50%, #4a628a 100%);
            color: #ffffff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.1);
        }
        
        .modern-footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }
        
        .footer-brand {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .footer-brand i {
            font-size: 1.5rem;
            color: #5d89ba;
            animation: iconPulse 2s ease-in-out infinite;
        }
        
        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .brand-text {
            font-weight: 700;
            font-size: 1.25rem;
            margin-right: 0.75rem;
            color: #ffffff;
        }
        
        .brand-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.875rem;
            margin-left: auto;
        }
        
        .footer-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        
        @media (max-width: 768px) {
            .footer-info {
                align-items: center;
            }
        }
        
        .version-badge {
            background: linear-gradient(135deg, #5d89ba, #7ba7d9);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 0.5rem;
            box-shadow: 0 2px 8px rgba(93, 137, 186, 0.3);
        }
        
        .copyright-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
        }
        
        .footer-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            margin: 0.75rem 0;
        }
        
        .footer-links {
            padding: 0.5rem 0;
        }
        
        .footer-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.875rem;
            transition: all 0.3s ease;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }
        
        .footer-link:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }
        
        .link-separator {
            color: rgba(255, 255, 255, 0.4);
            margin: 0 0.75rem;
        }
        
        /* Floating background elements */
        .footer-bg-elements {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
        }
        
        .floating-shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }
        
        .shape-1 {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .shape-2 {
            width: 60px;
            height: 60px;
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }
        
        .shape-3 {
            width: 100px;
            height: 100px;
            bottom: 10%;
            left: 70%;
            animation-delay: 4s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(180deg); }
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .modern-footer {
                text-align: center;
            }
            
            .footer-brand {
                justify-content: center;
                margin-bottom: 1rem;
            }
            
            .brand-subtitle {
                margin-left: 0;
                margin-top: 0.25rem;
                flex-basis: 100%;
            }
            
            .floating-shape {
                display: none;
            }
        }
    </style>
</body>
</html>
